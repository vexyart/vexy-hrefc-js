# this_file: src_docs/mkdocs.yml
site_name: Hrefc
site_description: Hover a link, see what's behind it. A tiny, dependency-free link-preview popup library (ESM + global).
site_url: https://vexy.dev/vexy-hrefc-js/
repo_url: https://github.com/vexyart/vexy-hrefc-js
repo_name: GitHub
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: fly-january
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
  - fly
extra:
  fly:
    chrome: none
    hue: indigo
    links: accent
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Styling: styling.md
  - Fetching and CORS: fetching-cors.md
  - Thumbnails: thumbnails.md
  - How it works: how-it-works.md
  - API reference: api-reference.md
  - Recipes: recipes.md
  - Examples: examples.md
  - Development: development.md
