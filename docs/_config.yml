# this_file: docs/_config.yml
title: vexy-hrefc
description: Hover a link, see what's behind it. A tiny, dependency-free link-preview popup.
remote_theme: just-the-docs/just-the-docs

url: https://vexyart.github.io
baseurl: /vexy-hrefc-js

# Just the Docs options
search_enabled: true
heading_anchors: true
color_scheme: light
enable_copy_code_button: true

aux_links:
  GitHub: https://github.com/vexyart/vexy-hrefc-js
  npm: https://www.npmjs.com/package/vexy-hrefc
aux_links_new_tab: true

callouts:
  note:
    color: blue
  warning:
    color: yellow
  tip:
    color: green

# Demos are plain HTML; let Jekyll copy them verbatim.
include:
  - demos

plugins:
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
